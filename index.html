<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Little Place ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating white hearts -->
    <div class="hearts">
        <div class="heart">♡</div>
        <div class="heart">♡</div>
        <div class="heart">♡</div>
        <div class="heart">♡</div>
        <div class="heart">♡</div>
        <div class="heart">♡</div>
        <div class="heart">♡</div>
        <div class="heart">♡</div>
        <div class="heart">♡</div>
        <div class="heart">♡</div>
        <div class="heart">♡</div>
        <div class="heart">♡</div>
    </div>


    <!-- FIRST SCREEN -->
    <div class="screen" id="welcomeScreen">

        <h1>Let's go in? ❤️</h1>

        <p>I have something for you...</p>

        <div class="buttons">

            <button id="yesBtn">
                YES ❤️
            </button>

            <button id="noBtn">
                NO 😏
            </button>

        </div>

    </div>


    <!-- SECOND SCREEN -->
    <div class="screen hidden" id="choiceScreen">

        <h1>How are you feeling? 💭</h1>

        <p>Choose what feels right...</p>

        <div class="choice-container">

            <button class="choice" id="happyBtn">
                <span>🥰</span>
                I'm feeling good
            </button>

            <button class="choice" id="sadBtn">
                <span>🥺</span>
                I need you
            </button>

        </div>

    </div>


    <!-- THIRD SCREEN -->
    <div class="screen hidden" id="matterScreen">

        <div class="matter-box">

            <h2>About us ❤️</h2>

            <p id="matterText">

                This is where your current matter will appear.

                <br><br>

                Replace this text with your message. ❤️

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
